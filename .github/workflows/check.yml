name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      local_only:
        description: Run the local npm package checks without the Remote application checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        node: ['22.18.0', '22', '24.0.0', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:local
      - run: npm run check:package
  redis:
    if: ${{ !inputs.local_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Redis test server
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends redis-server
          redis-server --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck:remote
      - run: npm run build:remote
      - run: npm run check:remote

  container:
    if: ${{ !inputs.local_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:remote
      - run: docker build --file Dockerfile.remote --tag nstdata-mcp-remote:ci .
      - run: npm run check:container -- nstdata-mcp-remote:ci
